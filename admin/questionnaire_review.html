<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>CSHSP 문진 검토 — 직원용</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; margin: 0; background: #f4f6fa; color: #1e293b; font-size: 14px; }
  header { background: #0f4c81; color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  header select { padding: 6px; border-radius: 6px; border: 0; }
  main { max-width: 980px; margin: 20px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; color: #fff; font-size: 11.5px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  td, th { border-bottom: 1px solid #e2e8f0; padding: 6px 8px; text-align: left; }
  .actions { margin-top: 10px; display: flex; gap: 8px; }
  button { padding: 7px 14px; border: 0; border-radius: 7px; cursor: pointer; color: #fff; font-size: 13px; }
  .ok { background: #2e7d32; } .no { background: #c62828; } .neutral { background: #64748b; }
  .empty { color: #64748b; text-align: center; padding: 30px; }
  input.note { padding: 7px; border: 1px solid #cbd5e1; border-radius: 6px; flex: 1; }
</style>
</head>
<body>
<header>
  <b>문진 검토 (직원용)</b>
  <span>
    상태:
    <select id="statusFilter">
      <option value="SUBMITTED" selected>SUBMITTED (검토 대기)</option>
      <option value="">전체</option>
      <option>DRAFT</option><option>REVIEWED</option><option>REJECTED</option>
    </select>
    검토자:
    <select id="actor">
      <option value="USR-0002" selected>직원QA1</option>
      <option value="USR-0001">병원장QA</option>
      <option value="USR-9000">AI 예약비서 (권한 없음 테스트)</option>
    </select>
  </span>
</header>
<main id="list"><div class="empty">불러오는 중…</div></main>

<script>
'use strict';
const API = new URLSearchParams(location.search).get('api') || 'http://localhost:8600';
const COLORS = { DRAFT: '#1565c0', SUBMITTED: '#e65100', REVIEWED: '#2e7d32', REJECTED: '#c62828' };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function load() {
  const status = $('#statusFilter').value;
  const res = await fetch(`${API}/api/questionnaires?status=${status}`, {
    headers: { 'X-User-Id': $('#actor').value } });
  if (!res.ok) {
    $('#list').innerHTML = `<div class="empty">조회 실패 (${res.status}) — 권한 또는 API 서버를 확인하세요.</div>`;
    return;
  }
  const { records } = await res.json();
  if (!records.length) { $('#list').innerHTML = '<div class="empty">해당 상태의 문진이 없습니다.</div>'; return; }
  $('#list').innerHTML = records.map((q) => `
    <div class="card">
      <h3>${esc(q.id)} — ${esc(q.patientName || q.patientId)} (${esc(q.patientBirthMasked || '')})
        <span class="badge" style="background:${COLORS[q.status] || '#64748b'}">${esc(q.status)}</span></h3>
      <div style="color:#64748b;font-size:12.5px">예약 ${esc(q.reservationId)} · 제출 ${esc(q.submittedAt || '-')} · 검토 ${esc(q.reviewedBy || '-')} ${esc(q.reviewNote ? '· ' + q.reviewNote : '')}</div>
      <table><thead><tr><th>코드</th><th>질문</th><th>응답</th><th>비고</th></tr></thead><tbody>
        ${(q.items || []).map((i) => `<tr><td>${esc(i.code)}</td><td>${esc(i.question)}</td>
          <td><b>${esc(i.answer ?? '-')}</b></td><td>${esc(i.detail || '')}</td></tr>`).join('')}
      </tbody></table>
      ${q.status === 'SUBMITTED' ? `
        <div class="actions">
          <input class="note" placeholder="검토 메모 (선택)" id="note-${esc(q.id)}">
          <button class="ok" onclick="review('${esc(q.id)}','REVIEWED')">확인 (REVIEWED)</button>
          <button class="no" onclick="review('${esc(q.id)}','REJECTED')">보완 요청 (REJECTED)</button>
        </div>` : ''}
    </div>`).join('');
}

async function review(qid, decision) {
  const res = await fetch(`${API}/api/questionnaires/${qid}/review`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-User-Id': $('#actor').value },
    body: JSON.stringify({ decision, note: (document.getElementById('note-' + qid) || {}).value || '' }),
  });
  const data = await res.json().catch(() => ({}));
  alert(res.ok ? `${qid} → ${decision} 처리 완료` : `실패: ${JSON.stringify(data.detail)}`);
  load();
}

$('#statusFilter').addEventListener('change', load);
$('#actor').addEventListener('change', load);
load();
</script>
</body>
</html>
